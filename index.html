<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f13;--card:#171a20;--tx:#f1f3f5;--mut:#9ca3af;--bd:#2c313a;--ac:#60a5fa;--no:#f87171;--ok:#4ade80;--wa:#fbbf24;--in:#0f1216}}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.3rem;margin:4px 0 14px}h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}

<script>
const $=id=>document.getElementById(id);
function el(t,a,...k){const e=document.createElement(t);if(a)for(const x in a){if(x==="class")e.className=a[x];else if(x==="style")e.style.cssText=a[x];else if(x.startsWith("on"))e[x]=a[x];else e.setAttribute(x,a[x]);}
  k.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const n1=v=>(Math.round(v*10)/10).toLocaleString("pt-BR");
const num=s=>{const v=parseFloat(String(s).replace(/\s|R\$/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isNaN(v)?0:v;};
const uid=()=>Math.random().toString(36).slice(2,9);
const CORES=["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#4f46e5","#0d9488","#9333ea","#a16207","#be123c","#0369a1","#4d7c0f"];
const chaveCor=n=>String(n||"").replace(/\s*[–—-]\s*(\d+\s*[ªº°]?|[ivxlc]+)\b.*$/i,"").replace(/\s+\d+\s*[ªº°]?\s*$/,"").trim().toLowerCase();
function coresObra(o){const m={},out={},g=o.cores||{},sv=o.coresSv||{};let k=0;(o.servicos||[]).forEach(s=>{const c=chaveCor(s.nome);if(!(c in m))m[c]=g[c]||CORES[k++%CORES.length];out[s.id]=sv[s.id]||m[c];});return out;}
const PALETA=["#2563eb","#0369a1","#0891b2","#0d9488","#16a34a","#65a30d","#4d7c0f","#a16207","#d97706","#ea580c","#dc2626","#be123c","#db2777","#9333ea","#7c3aed","#4f46e5","#475569","#111827"];
function escolherCor(o,s){const atual=coresObra(o)[s.id],grupo=chaveCor(s.nome),qtd=o.servicos.filter(x=>chaveCor(x.nome)===grupo).length;
  let esc=atual;const prev=el("div",{style:"height:34px;border-radius:8px;margin-bottom:10px;background:"+atual});
  const grade=el("div",{style:"display:grid;grid-template-columns:repeat(6,1fr);gap:8px"});
  const marcar=c=>{esc=c;prev.style.background=c;[...grade.children].forEach(b=>b.style.outline=b.dataset.c===c?"3px solid var(--tx)":"none");};
  PALETA.forEach(c=>{const b=el("button",{type:"button",style:`background:${c};border-color:${c};min-height:40px;padding:0`});b.dataset.c=c;b.onclick=()=>marcar(c);grade.append(b);});
  const livre=el("input",{type:"color",value:atual,style:"min-height:44px;padding:2px"});livre.oninput=()=>marcar(livre.value);
  const todos=el("input",{type:"checkbox"});todos.checked=true;todos.style.width="auto";
  const corpo=el("div",null,prev,grade,el("div",{style:"margin-top:10px"},campo("Ou escolha qualquer cor",livre)),
    qtd>1?el("label",{style:"display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem;color:var(--tx)"},todos,`Aplicar a todas as ${qtd} repetições de “${s.nome.replace(/\s*[–—-]\s*\d+.*$/,"")}”`):null);
  setTimeout(()=>marcar(atual),0);
  modal("Cor de “"+s.nome+"”",corpo,[["Aplicar","pri",()=>{
      if(qtd>1&&todos.checked){o.cores=o.cores||{};o.cores[grupo]=esc;if(o.coresSv)o.servicos.forEach(x=>{if(chaveCor(x.nome)===grupo)delete o.coresSv[x.id];});}
      else{o.coresSv=o.coresSv||{};o.coresSv[s.id]=esc;}
      salvar(o);render();}],
    ["Voltar à cor automática","",()=>{if(o.cores)delete o.cores[grupo];if(o.coresSv)o.servicos.forEach(x=>{if(chaveCor(x.nome)===grupo)delete o.coresSv[x.id];});salvar(o);render();}],["Cancelar"]]);}
function ask(msg,btns){return new Promise(res=>{const bt=el("div",{class:"bt"});const m=el("div",{class:"modal"},el("div",{class:"box"},el("p",null,msg),bt));
  btns.forEach(([t,v,c])=>bt.append(el("button",{class:c||"",type:"button",onclick:()=>{m.remove();res(v);}},t)));
  m.onclick=e=>{if(e.target===m){m.remove();res(null);}};document.body.append(m);});}
function toast(msg){const t=el("div",{class:"toast"},msg);document.body.append(t);setTimeout(()=>t.remove(),2600);}

// ---------- Modelo: etapas (títulos) e subetapas ----------
// [etapa, subetapa, tipo(g=obra toda,u=por unidade), duração, depende de, espera, pessoas]
const MODELO=[
 ["Pré-obra","Estudo de viabilidade","g",10,"",0,1],
 ["Pré-obra","Projetos (arq., estrutural, elétrico, hidráulico)","g",30,"Estudo de viabilidade",0,2],
 ["Pré-obra","Aprovação legal (alvará e licenças)","g",30,"Projetos (arq., estrutural, elétrico, hidráulico)",0,1],
 ["Pré-obra","Orçamento e cronograma","g",10,"Projetos (arq., estrutural, elétrico, hidráulico)",0,1],
 ["Pré-obra","Preparação do canteiro","g",7,"Aprovação legal (alvará e licenças)",0,4],
 ["Serviços preliminares","Limpeza do terreno","g",3,"Preparação do canteiro",0,4],
 ["Serviços preliminares","Terraplanagem e nivelamento","g",7,"Limpeza do terreno",0,3],
 ["Infraestrutura (fundações)","Locação da obra","g",2,"Terraplanagem e nivelamento",0,3],
 ["Infraestrutura (fundações)","Escavação","g",5,"Locação da obra",0,4],
 ["Infraestrutura (fundações)","Armação e concretagem das fundações","g",8,"Escavação",0,6],
 ["Infraestrutura (fundações)","Vigas baldrame","g",6,"Armação e concretagem das fundações",0,6],
 ["Infraestrutura (fundações)","Impermeabilização do baldrame","g",2,"Vigas baldrame",0,2],
 ["Superestrutura","Armação","g",20,"Impermeabilização do baldrame",0,4],
 ["Superestrutura","Formas","g",20,"Impermeabilização do baldrame",0,4],
 ["Superestrutura","Concretagem","g",8,"Formas",0,8],
 ["Superestrutura","Desforma","g",6,"Concretagem",14,3],
 ["Alvenaria (vedação)","Marcação e elevação","u",4,"Desforma",0,3],
 ["Cobertura","Estrutura do telhado","g",10,"Desforma",0,3],
 ["Cobertura","Telhamento e impermeabilização da laje","g",6,"Estrutura do telhado",0,3],
 ["Instalações prediais","Hidrossanitárias","u",2,"Marcação e elevação",0,2],
 ["Instalações prediais","Elétricas e dados","u",2,"Hidrossanitárias",0,2],
 ["Revestimentos","Chapisco","u",1,"Elétricas e dados",0,2],
 ["Revestimentos","Mestras","u",3,"Chapisco",0,2],
 ["Revestimentos","Emboço/Reboco","u",3,"Mestras",0,3],
 ["Revestimentos","Gesso","u",2,"Emboço/Reboco",0,2],
 ["Revestimentos","Contrapiso","u",2,"Emboço/Reboco",0,2],
 ["Impermeabilização","Áreas molhadas","u",2,"Contrapiso",3,2],
 ["Esquadrias","Portas e janelas","u",1,"Áreas molhadas",0,2],
 ["Acabamentos","Pisos e revestimentos cerâmicos","u",4,"Áreas molhadas",0,2],
 ["Acabamentos","Louças, metais e bancadas","u",1,"Pisos e revestimentos cerâmicos",0,2],
 ["Pintura final","Selador e massa","u",2,"Louças, metais e bancadas",0,2],
 ["Pintura final","Pintura","u",2,"Selador e massa",0,2],
 ["Pós-obra","Limpeza pós-obra","u",1,"Pintura",0,2],
 ["Pós-obra","Vistoria final","u",0.5,"Limpeza pós-obra",0,1],
 ["Pós-obra","Habite-se e registro","g",30,"Vistoria final",0,1]];
function modeloObra(){const ids={},et={},etapas=[];
  const servicos=MODELO.map(([e,nome,t,dur,dep,lag,pes])=>{if(!et[e]){et[e]=uid();etapas.push({id:et[e],nome:e});}
    const s={id:uid(),etapa:et[e],tipo:t==="g"?"global":"unit",nome,dur:0,equipes:1,pessoas:0,dep:dep?ids[dep]:"",lag:0,inicioMin:"",custo:0,periodos:[]};ids[nome]=s.id;return s;});
  return{etapas,servicos};}
const tipoDe=s=>s.tipo||"unit";
function libStatus(o,s){const modo=s.modoInicio||(s.inicioMin?"min":"auto");
  if(pausaAberta(s))return"travada";
  if(tipoDe(s)==="periodos"||(modo==="fixo"&&s.inicioFixo))return"liberada";
  const ex=o.exec&&o.exec[s.id];const temExec=ex&&Object.keys(ex).length>0;
  const st=s.lib&&s.lib.st;if(st==="liberada"||temExec)return"liberada";return"pendente";}
const pausaAberta=s=>(s.trav||[]).find(p=>!p.ate)||null;
function aplicarPausas(ini,d,P){let rem=d,cur=ini;const segs=[];
  for(const p of P){if(p.b<=cur)continue;if(p.a>=cur+rem-1e-9)break;
    if(p.a>cur){segs.push({ini:cur,fim:p.a});rem-=p.a-cur;}
    if(p.pct!=null&&p.pct!=="")rem=Math.max(0,d*(1-p.pct/100));
    cur=Math.max(cur,p.b);}
  segs.push({ini:cur,fim:cur+Math.max(rem,0.1)});return segs;}
function normalizar(o){
  if(!o.etapas){const nomes={pre:"Pré-obra",exec:"Execução",pos:"Pós-obra"};o.etapas=[];const vist={};
    (o.servicos||[]).forEach(s=>{const f=s.fase||"exec";if(!vist[f]){vist[f]=uid();o.etapas.push({id:vist[f],nome:nomes[f]||f});}s.etapa=vist[f];});
    if(!o.etapas.length)o.etapas.push({id:uid(),nome:"Execução"});}
  const ids=new Set(o.etapas.map(e=>e.id));
  (o.servicos=o.servicos||[]).forEach(s=>{if(!ids.has(s.etapa))s.etapa=o.etapas[0].id;if(s.pessoas==null)s.pessoas=0;if(!s.periodos)s.periodos=[];if(!s.tipo)s.tipo="unit";});
  o.servicos.forEach(s=>{if(!s.trav)s.trav=[];if(s.lib&&s.lib.st==="travada"){s.trav.push({de:s.lib.data,ate:null,motivo:s.lib.motivo||""});s.lib=s.lib.ant||{st:"liberada",data:s.lib.data};}});
  o.exec=o.exec||{};o.projetos=o.projetos||[];return o;}
function ordenar(o){normalizar(o);const ord={};o.etapas.forEach((e,i)=>ord[e.id]=i);
  o.servicos=o.servicos.map((s,i)=>[s,i]).sort((x,y)=>ord[x[0].etapa]-ord[y[0].etapa]||x[1]-y[1]).map(x=>x[0]);}
const nomeEtapa=(o,id)=>(o.etapas.find(e=>e.id===id)||{}).nome||"—";
let fechadas=new Set();

// ---------- Calendário (dias úteis) ----------
function Cal(o){
  const ini=new Date(o.inicio+"T12:00"),fer=new Set(o.feriados||[]),dias=[];
  const util=d=>{const w=d.getDay();if(w===0)return false;if(w===6&&!o.sabado)return false;return !fer.has(iso(d));};
  function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  const cur=new Date(ini);
  function ext(n){while(dias.length<=n){if(util(cur))dias.push(new Date(cur));cur.setDate(cur.getDate()+1);}}
  return{
    data(i){i=Math.max(0,Math.floor(i+1e-9));ext(i);return dias[i];},
    fim(e){return this.data(Math.ceil(e-1e-9)-1);},
    idx(isoStr){if(!isoStr)return 0;const alvo=new Date(isoStr+"T12:00");let i=0;while(true){ext(i);if(dias[i]>=alvo)return i;i++;if(i>20000)return i;}},
    iso
  };
}
const fd=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});

// ---------- Motor de cálculo (linha de balanço) ----------
function addDiaN(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDia(iso){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function calcular(o){
  ordenar(o);
  const cal=Cal(o),N=Math.max(1,Math.floor(o.unidades||1)),res={},ordem=[],HOJE=cal.idx(hojeISO()),CM=coresObra(o);
  o.servicos.forEach((s,si)=>{
    const tp=tipoDe(s),gl=tp!=="unit";
    const d=Math.max(0,+s.dur||0),k=gl?1:Math.max(1,Math.floor(+s.equipes||1)),lag=Math.max(0,+s.lag||0),pes=Math.max(0,+s.pessoas||0);
    const modo=s.modoInicio||(s.inicioMin?"min":"auto");
    const fixo=modo==="fixo"&&s.inicioFixo;
    const libSt=libStatus(o,s),exS=(o.exec&&o.exec[s.id])||{};
    const pend=libSt==="pendente"&&tp!=="periodos";

function grafico(c,o){
  const NS="http://www.w3.org/2000/svg",cal=c.cal,P=(o.prefixo||"Un.").trim();
  const css=getComputedStyle(document.documentElement),mut=css.getPropertyValue("--mut").trim(),bd=css.getPropertyValue("--bd").trim(),tx=css.getPropertyValue("--tx").trim();
  const linhas=[];
  o.etapas.forEach(et=>{const rs=c.ordem.filter(r=>r.s.etapa===et.id);if(!rs.length)return;
    linhas.push({et,ini:Math.min(...rs.map(r=>r.inicio)),fim:Math.max(...rs.map(r=>r.fim)),n:rs.length});
    if(!fechadas.has(et.id))rs.forEach(r=>linhas.push({r}));});
  const RH=28,TOP=40,EH=70,LW=Math.min(240,Math.max(140,window.innerWidth*0.38));
  const dias=Math.ceil(c.fim)+3,px=Math.max(4,Math.min(24,(Math.min(1100,window.innerWidth)-LW-40)/dias*1.6));
  const W=dias*px+20,Hg=TOP+linhas.length*RH,H=Hg+EH+22;
  const svg=(w,h)=>{const e=document.createElementNS(NS,"svg");e.setAttribute("width",w);e.setAttribute("height",h);e.setAttribute("viewBox",`0 0 ${w} ${h}`);return e;};
  const mk=(p,t,at,txt)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;p.append(e);return e;};
  const tip=(e,txt)=>{const t=document.createElementNS(NS,"title");t.textContent=txt;e.append(t);};
  const tog=id=>{fechadas.has(id)?fechadas.delete(id):fechadas.add(id);render();};
  const Ls=svg(LW,H);
  linhas.forEach((l,j)=>{const y=TOP+j*RH;
    if(l.et){const r=mk(Ls,"rect",{x:0,y,width:LW,height:RH,fill:bd,"fill-opacity":"0.55",style:"cursor:pointer"});r.onclick=()=>tog(l.et.id);
      const nm=(fechadas.has(l.et.id)?"▸ ":"▾ ")+l.et.nome,max=Math.floor((LW-12)/7);
      const t=mk(Ls,"text",{x:6,y:y+RH*0.66,fill:tx,"font-size":"12","font-weight":"700",style:"cursor:pointer"},nm.length>max?nm.slice(0,max-1)+"…":nm);t.onclick=()=>tog(l.et.id);tip(t,l.et.nome);return;}
    mk(Ls,"rect",{x:14,y:y+RH/2-5,width:10,height:10,rx:2,fill:l.r.cor});
    const nm=l.r.s.nome,max=Math.floor((LW-34)/6.6);
    const t=mk(Ls,"text",{x:30,y:y+RH*0.66,fill:tx,"font-size":"12"},nm.length>max?nm.slice(0,max-1)+"…":nm);tip(t,nm);
    mk(Ls,"line",{x1:0,x2:LW,y1:y+RH,y2:y+RH,stroke:bd,"stroke-opacity":"0.5"});});
  mk(Ls,"text",{x:6,y:Hg+18,fill:tx,"font-size":"12","font-weight":"700"},"Efetivo (pessoas)");
  mk(Ls,"line",{x1:LW-0.5,x2:LW-0.5,y1:0,y2:H,stroke:bd});
  const G=svg(W,H),X=d=>10+d*px;
  linhas.forEach((l,j)=>{const y=TOP+j*RH;if(l.et){const r=mk(G,"rect",{x:0,y,width:W,height:RH,fill:bd,"fill-opacity":"0.35",style:"cursor:pointer"});r.onclick=()=>tog(l.et.id);}
    else mk(G,"line",{x1:0,x2:W,y1:y+RH,y2:y+RH,stroke:bd,"stroke-opacity":"0.5"});});
  let ultM=-1,ultS=-1;
  for(let d=0;d<dias;d++){const dt=cal.data(d),m=dt.getMonth();
    if(m!==ultM){ultM=m;mk(G,"line",{x1:X(d),x2:X(d),y1:0,y2:H,stroke:bd});
      mk(G,"text",{x:X(d)+4,y:14,fill:tx,"font-size":"11","font-weight":"600"},dt.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}).replace(". de ","/").replace(".",""));}
    const sem=Math.floor((dt-new Date(dt.getFullYear(),0,1))/6048e5);
    if(sem!==ultS){ultS=sem;if(px*(o.sabado?6:5)>=26){mk(G,"line",{x1:X(d),x2:X(d),y1:TOP-12,y2:Hg,stroke:bd,"stroke-opacity":"0.35"});
      mk(G,"text",{x:X(d)+2,y:TOP-4,fill:mut,"font-size":"9"},String(dt.getDate()).padStart(2,"0"));}}}
  mk(G,"line",{x1:0,x2:W,y1:TOP-0.5,y2:TOP-0.5,stroke:bd});
  const hi=cal.idx(hojeISO());if(hi>0&&hi<dias){mk(G,"line",{x1:X(hi),x2:X(hi),y1:TOP,y2:H,stroke:"var(--ac)","stroke-width":"1.5","stroke-dasharray":"4 3"});mk(G,"text",{x:X(hi)+3,y:TOP+10,fill:"var(--ac)","font-size":"10","font-weight":"600"},"hoje");}
  const pos={};linhas.forEach((l,j)=>{if(l.r)pos[l.r.s.id]=TOP+j*RH;});
  linhas.forEach((l,j)=>{
    if(l.et){const y=TOP+j*RH;const b=mk(G,"rect",{x:X(l.ini),y:y+9,width:Math.max(2,(l.fim-l.ini)*px),height:RH-18,rx:2,fill:tx,"fill-opacity":"0.75"});
      tip(b,`${l.et.nome}: ${fd(cal.data(l.ini))} a ${fd(cal.fim(l.fim))}`);return;}
    const r=l.r,y=pos[r.s.id],bh=RH-10,by=y+5,ex=(o.exec&&o.exec[r.s.id])||{};
    if(o.base&&o.base.sv[r.s.id]){const b=o.base.sv[r.s.id],bi=cal.idx(b.ini),bf=cal.idx(addDia(b.fim));const e=mk(G,"rect",{x:X(bi),y:y+RH-4,width:Math.max(1,(bf-bi)*px),height:2.5,fill:mut,"fill-opacity":"0.75"});tip(e,"Linha de base: "+fdI(b.ini)+" a "+fdI(b.fim));}
    if(r.tp==="unit"){
      const fundo=mk(G,"rect",{x:X(r.inicio),y:by,width:Math.max(2,(r.fim-r.inicio)*px),height:bh,rx:4,fill:r.cor,"fill-opacity":"0.18",stroke:r.cor,"stroke-width":"1"});
      tip(fundo,`${r.s.nome}: ${fd(cal.data(r.inicio))} a ${fd(cal.fim(r.fim))}`+(r.espera>0?` · ${n1(r.espera)} d parados`:""));
      const sub=bh/Math.max(1,r.k);
      r.un.forEach((u,i)=>{const e=mk(G,"rect",{x:X(u.ini),y:by+u.eq*sub,width:Math.max(1,(u.fim-u.ini)*px-0.6),height:sub,fill:ex[i]?"#15803d":r.cor,"fill-opacity":"0.9"});
        tip(e,`${r.s.nome} · ${P} ${i+1}: ${fd(cal.data(u.ini))} a ${fd(cal.fim(u.fim))}`+(u.espera>0?` (esperou ${n1(u.espera)} d)`:""));});
    }else{
      if(r.per.length>1)mk(G,"line",{x1:X(r.inicio),x2:X(r.fim),y1:y+RH/2,y2:y+RH/2,stroke:r.cor,"stroke-width":"1.5","stroke-dasharray":"3 3"});
      r.per.forEach((p,pi)=>{const ok=r.tp==="global"?ex.g:ex["p"+pi];
        const e=mk(G,"rect",{x:X(p.ini),y:by,width:Math.max(2,(p.fim-p.ini)*px-0.6),height:bh,rx:3,fill:ok?"#15803d":r.cor,"fill-opacity":p.auto?"0.4":"0.88"});
        tip(e,`${r.s.nome}${r.per.length>1?" · período "+(pi+1):""}: ${fd(cal.data(p.ini))} a ${fd(cal.fim(p.fim))}${p.obs?" · "+p.obs:""}`);});
    }
    if(r.libSt!=="liberada"){const ic=mk(G,"text",{x:X(r.inicio)-3,y:y+RH*0.68,"font-size":"12","text-anchor":"end"},r.libSt==="travada"?"🔒":"⏸");
      tip(ic,r.libSt==="travada"?"Travada"+(pausaAberta(r.s)&&pausaAberta(r.s).motivo?": "+pausaAberta(r.s).motivo:""):"Aguardando liberação");}
    if(r.primeiraEspera!==null){const u=r.un[r.primeiraEspera],cx=X(u.ini-u.espera);
      const d=mk(G,"circle",{cx,cy:y+RH/2,r:5,fill:"#dc2626",stroke:"#fff","stroke-width":"1.5"});tip(d,`Alcança ${r.pred.s.nome} no ${P} ${r.primeiraEspera+1}`);}
    if(r.pred&&pos[r.pred.s.id]!=null){const yp=pos[r.pred.s.id]+RH/2,yc=y+RH/2;
      const ss=r.s.depTipo==="SS",xp=ss?X(r.pred.inicio):(r.predUn&&r.tp==="unit"?X(r.pred.un[0].fim):X(r.pred.fim)),xc=X(r.inicio);
      mk(G,"path",{d:`M${xp} ${yp} L${xp+4} ${yp} L${xp+4} ${yc} L${xc} ${yc}`,fill:"none",stroke:mut,"stroke-width":"1","stroke-opacity":"0.7"});
      mk(G,"path",{d:`M${xc} ${yc} l-5 -3 v6 z`,fill:mut,"fill-opacity":"0.8"});}
  });
  // efetivo
  const mx=Math.max(1,...c.efe),base=Hg+EH+8;
  mk(G,"line",{x1:0,x2:W,y1:Hg,y2:Hg,stroke:bd});mk(G,"line",{x1:0,x2:W,y1:base,y2:base,stroke:bd});
  c.efe.forEach((v,d)=>{if(!v)return;const h=v/mx*(EH-14);const b=mk(G,"rect",{x:X(d),y:base-h,width:Math.max(1,px-0.5),height:h,fill:"var(--ac)","fill-opacity":"0.6"});tip(b,`${fd(cal.data(d))}: ${v} pessoas`);});
  let pi=0;c.efe.forEach((v,i)=>{if(v>c.efe[pi])pi=i;});
  if(c.efe[pi])mk(G,"text",{x:X(pi),y:base-(EH-14)-3,fill:tx,"font-size":"10","font-weight":"700"},"pico "+c.efe[pi]);
  mk(Ls,"text",{x:6,y:base,fill:mut,"font-size":"10"},"máx. "+Math.max(0,...c.efe));
  const wrap=el("div",{class:"chart",style:"display:flex;overflow:hidden"});
  const esq=el("div",{style:"flex:0 0 auto;background:var(--card)"});esq.append(Ls);
  const dir=el("div",{style:"flex:1;overflow-x:auto"});dir.append(G);
  wrap.append(esq,dir);
  if(hi>0&&hi<dias)setTimeout(()=>{dir.scrollLeft=Math.max(0,X(hi)-80);},0);
  return wrap;
}

function baixar(nome,texto,tipo){const u=URL.createObjectURL(new Blob([texto],{type:tipo})),l=document.createElement("a");l.href=u;l.download=nome;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function exportarObra(o){const {id,...dados}=JSON.parse(JSON.stringify(o));baixar("Backup - "+(o.nome||"obra").replace(/[\\/:*?"<>|]/g,"")+" - "+hojeISO()+".json",JSON.stringify({app:"planejamento-obras",versao:1,obra:dados},null,1),"application/json");toast("Backup gerado");}
function importarObra(){const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const dados=j.obra||j;if(!dados.servicos||!dados.etapas)throw 0;
    const nome=await ask(`Importar "${dados.nome||"obra"}" como uma nova obra?`,[["Importar",true,"pri"],["Cancelar",false]]);if(!nome)return;
    delete dados.id;dados.nome=(dados.nome||"Obra")+(obras.some(x=>x.nome===dados.nome)?" (importada)":"");dados.criado=Date.now();
    const ref=db.collection("obras").doc();await ref.set(JSON.parse(JSON.stringify(dados)));toast("Obra importada");}catch(e){toast("Arquivo inválido");}};
  inp.click();}
